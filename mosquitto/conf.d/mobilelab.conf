# Mobile Lab Station broker configuration.
# Installed to /etc/mosquitto/conf.d/mobilelab.conf by ops/install-mosquitto.sh.
#
# The Debian base file /etc/mosquitto/mosquitto.conf already sets persistence,
# persistence_location, and log_dest. Mosquitto refuses to start on a duplicate
# of those settings, so this file must not restate them.
#
# The broker listens on loopback only. Every V1 publisher and subscriber runs on
# this Pi: the manual entry form, gpsd, the WQL bridge, and the writer.
#
# The WQL loggers are NOT direct MQTT clients. Arch section 3 locks that. They
# POST over HTTP to the bridge, and the bridge republishes here. So the loggers
# do not need the broker port to be open on the AP.
#
# Open the AP listener only when hostapd runs on wlan0, and only if a future
# driver has to publish from another host. Network configuration happens in
# person at the console.
#
#   listener 1883 10.42.0.1
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd

listener 1883 127.0.0.1
allow_anonymous true

autosave_interval 60
max_queued_messages 10000

log_type error
log_type warning
log_type notice
